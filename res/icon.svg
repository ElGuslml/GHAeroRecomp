<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <!-- The GHAeroRecomp icon: a guitar pick on a riveted steel medallion, the pick made of the label at the heart of GH
       Aerosmith Launcher's art (launcher/art/background.svg, the psychedelic vinyl): its orange sunburst, magenta and
       purple rings, cream middle and pink star, on the art's dark purple stage with its orange and magenta glow, drawn
       for this project (no art from the game); the family's icon (GHMetalRecomp's, GHVanHRecomp's, GH5Recomp's,
       GHWoRRecomp's) with its own pick. res/make_icon.mjs builds res/icon.ico from this file (40 px and up) and
       icon_small.svg (16-32 px). -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f2ee"/>
      <stop offset="0.35" stop-color="#a9a6a1"/>
      <stop offset="0.55" stop-color="#e4e1db"/>
      <stop offset="1" stop-color="#5e5b57"/>
    </linearGradient>
    <radialGradient id="stage" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#2a1430"/>
      <stop offset="0.6" stop-color="#140c19"/>
      <stop offset="1" stop-color="#0d0a12"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#b0307a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#b0307a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5e5b57"/>
    </radialGradient>
    <clipPath id="inside">
      <circle cx="128" cy="128" r="88"/>
    </clipPath>
    <clipPath id="pickArea">
      <path d="M 128,204 C 100,178 66,140 66,104 C 66,74 98,58 128,58 C 158,58 190,74 190,104 C 190,140 156,178 128,204 Z"/>
    </clipPath>
    <circle id="stud" r="4.6" fill="url(#rivet)" stroke="#1b1917" stroke-width="1.5"/>
    <path id="ray" d="M 128,128 L 117,20 L 139,20 Z"/>
    <path id="sparkle" d="M 0,-9 L 2,-2 L 9,0 L 2,2 L 0,9 L -2,2 L -9,0 L -2,-2 Z" fill="#ffe2c0"/>
    <path id="pick" d="M 128,204 C 100,178 66,140 66,104 C 66,74 98,58 128,58 C 158,58 190,74 190,104 C 190,140 156,178 128,204 Z"/>
  </defs>

  <!-- Medallion: a steel rim with eight rivets, the stage dark in the middle. -->
  <circle cx="128" cy="128" r="106" fill="url(#steel)" stroke="#1b1917" stroke-width="4"/>
  <circle cx="128" cy="128" r="101" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <use xlink:href="#stud" transform="translate(218.5 165.5)"/>
  <use xlink:href="#stud" transform="translate(165.5 218.5)"/>
  <use xlink:href="#stud" transform="translate(90.5 218.5)"/>
  <use xlink:href="#stud" transform="translate(37.5 165.5)"/>
  <use xlink:href="#stud" transform="translate(37.5 90.5)"/>
  <use xlink:href="#stud" transform="translate(90.5 37.5)"/>
  <use xlink:href="#stud" transform="translate(165.5 37.5)"/>
  <use xlink:href="#stud" transform="translate(218.5 90.5)"/>
  <circle cx="128" cy="128" r="90" fill="url(#stage)" stroke="#1b1917" stroke-width="4"/>

  <!-- Stage light: rays from the middle and the art's orange and magenta glow behind the pick. -->
  <g clip-path="url(#inside)">
    <g fill="#ffffff" fill-opacity="0.05">
      <use xlink:href="#ray"/>
      <use xlink:href="#ray" transform="rotate(30 128 128)"/>
      <use xlink:href="#ray" transform="rotate(60 128 128)"/>
      <use xlink:href="#ray" transform="rotate(90 128 128)"/>
      <use xlink:href="#ray" transform="rotate(120 128 128)"/>
      <use xlink:href="#ray" transform="rotate(150 128 128)"/>
      <use xlink:href="#ray" transform="rotate(180 128 128)"/>
      <use xlink:href="#ray" transform="rotate(210 128 128)"/>
      <use xlink:href="#ray" transform="rotate(240 128 128)"/>
      <use xlink:href="#ray" transform="rotate(270 128 128)"/>
      <use xlink:href="#ray" transform="rotate(300 128 128)"/>
      <use xlink:href="#ray" transform="rotate(330 128 128)"/>
    </g>
    <circle cx="128" cy="128" r="88" fill="url(#glow)"/>
  </g>

  <!-- The pick: a cream border around it, then the label: the orange sunburst, a magenta band along the edge, the
       purple ring, the cream middle, the pink star and the spindle hole. -->
  <use xlink:href="#pick" fill="none" stroke="#f4e6d0" stroke-width="16" stroke-linejoin="round"/>
  <use xlink:href="#pick" fill="#f5872a"/>
  <g clip-path="url(#pickArea)">
    <path d="M 128.0,117.0 L 288.0,117.0 L 282.5,158.4 Z M 128.0,117.0 L 266.6,197.0 L 241.1,230.1 Z M 128.0,117.0 L 208.0,255.6 L 169.4,271.5 Z M 128.0,117.0 L 128.0,277.0 L 86.6,271.5 Z M 128.0,117.0 L 48.0,255.6 L 14.9,230.1 Z M 128.0,117.0 L -10.6,197.0 L -26.5,158.4 Z M 128.0,117.0 L -32.0,117.0 L -26.5,75.6 Z M 128.0,117.0 L -10.6,37.0 L 14.9,3.9 Z M 128.0,117.0 L 48.0,-21.6 L 86.6,-37.5 Z M 128.0,117.0 L 128.0,-43.0 L 169.4,-37.5 Z M 128.0,117.0 L 208.0,-21.6 L 241.1,3.9 Z M 128.0,117.0 L 266.6,37.0 L 282.5,75.6 Z" fill="#ffb06b" fill-opacity="0.6"/>
    <use xlink:href="#pick" fill="none" stroke="#d64fa8" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <use xlink:href="#pick" fill="none" stroke="#0b0a0a" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="128" cy="117" r="44" fill="#7b3fc4" stroke="#0b0a0a" stroke-width="3"/>
  <circle cx="128" cy="117" r="35" fill="#f4e6d0"/>
  <path d="M 128.0,89.5 L 135.1,108.3 L 155.1,109.2 L 139.4,121.7 L 144.8,141.1 L 128.0,130.0 L 111.2,141.1 L 116.6,121.7 L 100.9,109.2 L 120.9,108.3 Z" fill="#d64fa8" stroke="#8a2366" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="128" cy="118" r="4" fill="#0d0a12"/>

  <!-- Sparkles, the art's warm white -->
  <use xlink:href="#sparkle" transform="translate(70 70)"/>
  <use xlink:href="#sparkle" transform="translate(190 178) scale(0.75)"/>
</svg>
